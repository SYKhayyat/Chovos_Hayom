# Localization codegen (`flutter gen-l10n`, run for you by `flutter pub get`).
#
# The generated output is written into `lib/` and **gitignored** — the reasoning
# is in `.gitignore` beside the entry, and the short form is that a table which
# is regenerated by `pub get` in two seconds from the two files next to it cannot
# go stale, so committing it buys a diff nobody reads and a CI gate that checks
# for a defect the commit invented.
#
# Naming an `output-dir` under `lib/` is still what makes the output *importable
# by path* rather than through the synthetic package gen-l10n used to default to,
# which is why the setting stays even though nothing is committed any more.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# `AppLocalizations.of(context)` returns non-null. Every screen sits under the
# MaterialApp that installs the delegate, so the nullable form would add a `!`
# to several hundred call sites to describe a state that cannot happen.
nullable-getter: false

# An untranslated string in a shipped locale is a defect, not a warning to
# scroll past: this fails the build and names the missing keys.
untranslated-messages-file: l10n_untranslated.json

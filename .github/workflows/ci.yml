name: CI

# The suite and the analyzer were green, but nothing enforced that — so a
# regression could land and stay landed. This runs on every push and PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository or publishes anything; say so rather
# than inheriting whatever the repository default happens to be.
permissions:
  contents: read

env:
  # Pinned, not `stable`.
  #
  # Two dependencies are held back *because of* this exact Flutter version:
  # file_picker is at 8.x because 11's Android build assumes AGP 9 implies
  # built-in Kotlin, which 3.44 ships off, and android/build.gradle.kts lifts
  # plugin subprojects to compileSdk 36 for the same generation of the toolchain.
  # Tracking `stable` means the day Flutter releases, CI starts testing a
  # combination nobody chose — and the release APK it builds changes with no
  # commit behind it. Bump this deliberately, with the pins reviewed alongside.
  FLUTTER_VERSION: '3.44.4'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The Drift/Riverpod `.g.dart` files *are* committed — build_runner is slow
      # and needs its own dependency tree, so the checkout is worth its diff — and
      # a mismatch means someone edited a schema or provider without regenerating,
      # which fails at runtime rather than at compile time. That is exactly what
      # CI should catch. (The localizations are the other case entirely; see the
      # step below.)
      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- '*.g.dart' \
            || (echo "::error::Generated code is stale. Run: dart run build_runner build" && exit 1)

      # There is deliberately no staleness check for the localizations: the
      # generated table is not committed (see .gitignore), and `flutter pub get`
      # above regenerated it from the .arb files in about two seconds. A table
      # that is built from scratch on every checkout has no stale state to
      # detect. The step that used to live here diffed a fresh generate against
      # the committed one — a gate whose only failure mode was created by the
      # decision to commit.
      #
      # What is real is the gate below. gen-l10n is re-run explicitly rather than
      # relying on `pub get`'s side effect, so the report this reads is produced
      # by a command in this file.
      #
      # A key in the English template with no translation is a screen that
      # silently falls back to English for a Hebrew reader. gen-l10n reports
      # them rather than failing, so the failing is done here.
      - name: Assert every shipped locale is fully translated
        run: |
          flutter gen-l10n
          if [ -s l10n_untranslated.json ] && [ "$(tr -d '[:space:]' < l10n_untranslated.json)" != "{}" ]; then
            echo "::error::Untranslated messages — see below."
            cat l10n_untranslated.json
            exit 1
          fi

      # Deliberately no `dart format` gate. The codebase is hand-wrapped so that
      # the explanatory comments read well, and the current formatter reflows
      # ~100 files against that. The analyzer enforces what actually matters.
      - run: flutter analyze --fatal-infos

      - run: flutter test --coverage

      # The flag used to produce an artifact nobody read: no threshold, no
      # badge, no diff. A number nobody looks at only ever goes down, and a gate
      # that cannot fail is not a gate — the same argument this file makes about
      # the stale-l10n check it deleted. So either `--coverage` means something
      # or it should go; this is the smallest version of meaning something.
      #
      # Per layer, not blended: `domain/` is pure Dart with no framework, so a
      # 90% floor there is a low bar, while a screen's last few percent are error
      # branches needing a broken database. One number would hide a collapse in
      # the first behind the second. The floors and the reason for each are in
      # the tool.
      - name: Coverage floors
        run: dart run tool/check_coverage.dart

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    # A release build is where R8 and the manifest actually get exercised; the
    # analyzer never touches either. (Signing is debug in CI — there is no
    # keystore secret — so this proves the build works, not that the artifact is
    # shippable; build.gradle.kts falls back to the debug key when key.properties
    # is absent.)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release

      # An assertion that can fail, which is what the job was missing: R8 emits a
      # mapping file only when minify actually ran, so its absence means someone
      # turned isMinifyEnabled off (or unwired it, as build.gradle.kts once was)
      # and the release build silently stopped shrinking. That was invisible
      # before — the build exited zero either way.
      - name: Assert R8 shrinking ran on the release build
        run: |
          test -f build/app/outputs/mapping/release/mapping.txt \
            || (echo "::error::No R8 mapping file — minify is off in the release build (see android/app/build.gradle.kts)." && exit 1)

  build-windows:
    # The app ships on Windows and every Windows build until now happened on the
    # author's own machine — which is not a coverage hole so much as one waiting
    # for the week that machine stops being the one they are sitting at.
    #
    # The argument for it is this file's own, made two jobs up about R8: that
    # assertion is documented as toothless locally because Gradle reuses a stale
    # mapping, and meaningful only on a clean checkout. CMake caches at least as
    # aggressively, and the CMake target-id failure that once broke the Windows
    # build *completely* is exactly the class a warm build tree hides. A clean
    # runner is the only place that class of failure is visible at all.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

      # An assertion that can fail, for the same reason the R8 one exists: the
      # build command exits zero whether or not it produced something you can
      # run, and "it compiled" is not the question this job is asking.
      - name: Assert the release build produced an executable
        shell: bash
        run: |
          if [ ! -f build/windows/x64/runner/Release/chovos_hayom.exe ]; then
            echo "::error::No Windows executable — the release build exited zero without producing one."
            ls -R build/windows/x64/runner || true
            exit 1
          fi
